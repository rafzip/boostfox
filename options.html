<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { font: 14px system-ui; margin: 16px; max-width: 900px; }
      textarea { width: 100%; height: 240px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      select, button { padding: 6px 10px; }
      input { padding: 6px 10px; flex: 1; }
      .row { margin: 10px 0; display: flex; gap: 8px; align-items: center; }
      .column { display: flex; flex-direction: column; gap: 8px; }
      .muted { opacity: 0.7; font-size: 12px; }
    </style>
  </head>
  <body>
    <h2>boostfox</h2>

    <div class="row">
      <input id="host" placeholder="example.com or https://example.com" />
      <button id="save">save</button>
      <button id="remove">remove</button>
    </div>

    <div class="row">
      <div class="column" style="flex: 1;">
        <div class="muted">saved sites</div>
        <select id="siteList" size="8"></select>
      </div>
      <div class="column" style="flex: 3;">
        <div class="muted">css for selected site</div>
        <textarea id="css" placeholder="/* per-site CSS */"></textarea>
      </div>
    </div>

    <div class="row">
      <div class="column" style="flex: 1;">
        <div class="muted">zaps saved</div>
        <select id="zapList" size="8"></select>
      </div>
      <div class="column" style="flex: 3;">
        <div class="muted">clear zaps for selected site</div>
        <button id="clearZaps">clear zaps</button>
      </div>
    </div>

    <div id="status" class="muted"></div>

    <script src="options.js"></script>
  </body>
</html>
